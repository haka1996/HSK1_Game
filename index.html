<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汉语 · Chinese Learning</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=zodiak@400,700&display=swap" rel="stylesheet" />
    <style>
        :root, [data-theme="light"] {
            --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9;
            --color-surface-offset: #f3f0ec; --color-surface-dynamic: #e6e4df;
            --color-divider: #dcd9d5; --color-border: #d4d1ca; --color-text: #28251d;
            --color-text-muted: #7a7974; --color-text-faint: #bab9b4; --color-primary: #01696f;
            --color-primary-hover: #0c4e54; --color-primary-active: #0f3638;
            --color-primary-highlight: #cedcd8; --color-success: #437a22;
            --color-success-hover: #2e5c10; --color-success-highlight: #d4dfcc;
            --color-error: #a12c7b; --color-error-hover: #7d1e5e; --color-error-highlight: #e0ced7;
            --color-gold: #d19900; --color-gold-highlight: #e9e0c6; --color-orange: #da7101;
            --color-orange-highlight: #e7d7c4; --radius-sm: 0.375rem; --radius-md: 0.5rem;
            --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-full: 9999px;
            --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
            --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
            --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
            --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
            --font-display: "Zodiak", "Georgia", serif; --font-body: "Satoshi", "Inter", sans-serif;
            --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
            --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
            --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
            --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
            --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
            --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
            --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
        }
        [data-theme="dark"] {
            --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
            --color-surface-offset: #1d1c1a; --color-surface-dynamic: #2d2c2a;
            --color-divider: #262523; --color-border: #393836; --color-text: #cdccca;
            --color-text-muted: #797876; --color-text-faint: #5a5957; --color-primary: #4f98a3;
            --color-primary-hover: #227f8b; --color-primary-active: #1a626b;
            --color-primary-highlight: #313b3b; --color-success: #6daa45;
            --color-success-hover: #4d8f25; --color-success-highlight: #3a4435;
            --color-error: #d163a7; --color-error-hover: #b9478f; --color-error-highlight: #4c3d46;
            --color-gold: #e8af34; --color-gold-highlight: #4d4332;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100dvh; font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); transition: background var(--transition); }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6); background: var(--color-surface); border-bottom: 1px solid var(--color-border); position: sticky; top: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: var(--space-3); text-decoration: none; color: var(--color-text); }
        .logo-mark { width: 32px; height: 32px; }
        .logo-text { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; }
        .main { flex: 1; padding: var(--space-8) var(--space-6); max-width: 920px; margin: 0 auto; width: 100%; }
        .screen { display: none; animation: fadeIn 0.25s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .class-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
        .class-card, .mode-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-6); cursor: pointer; transition: all var(--transition); }
        .class-card:hover, .mode-card:hover { border-color: var(--color-primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn { padding: var(--space-3) var(--space-6); border-radius: var(--radius-lg); font-weight: 600; cursor: pointer; transition: all var(--transition); border: none; }
        .btn-primary { background: var(--color-primary); color: white; }
        .btn-secondary { background: var(--color-surface-offset); color: var(--color-text); }
        .flashcard { background: var(--color-surface); border-radius: var(--radius-xl); padding: var(--space-10); text-align: center; box-shadow: var(--shadow-md); min-height: 250px; display: flex; flex-direction: column; justify-content: center; margin-bottom: var(--space-6); }
        .card-main { font-size: 3rem; font-weight: 700; font-family: var(--font-display); }
        .hidden { display: none !important; }
        .answer-input { width: 100%; padding: var(--space-4); border-radius: var(--radius-lg); border: 2px solid var(--color-border); outline: none; font-size: var(--text-base); }
        .answer-input:focus { border-color: var(--color-primary); }
        .hm-figure { white-space: pre; font-family: monospace; background: #000; color: #0f0; padding: 1rem; border-radius: var(--radius-lg); margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="logo" href="#" onclick="showScreen('home'); return false;">
            <svg class="logo-mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="var(--color-primary)"/><text x="16" y="22" text-anchor="middle" font-size="18" fill="white">汉</text></svg>
            <div><div class="logo-text">汉语</div><div class="logo-sub">Chinese Learning</div></div>
        </a>
        <button class="btn btn-secondary" id="themeToggle">🌓</button>
    </header>

    <main class="main">
        <div class="screen active" id="screen-home">
            <div class="home-header"><h1>My Lessons</h1><p>Pick a class to start learning</p></div>
            <div class="class-grid" id="classGrid"></div>
        </div>

        <div class="screen" id="screen-class">
            <button class="btn btn-secondary" onclick="showScreen('home')" style="margin-bottom:20px">← Back</button>
            <h1 id="classTitle" style="margin-bottom:10px"></h1>
            <p id="classTopic" style="color:var(--color-text-muted); margin-bottom:30px"></p>
            <div class="class-grid">
                <div class="mode-card" onclick="openMode('concepts')"><h2>📘 Concepts</h2><p>Grammar and explanations</p></div>
                <div class="mode-card" onclick="openMode('grammar')"><h2>📝 Grammar</h2><p>Sentence translation</p></div>
                <div class="mode-card" onclick="openMode('vocab')"><h2>🔤 Vocabulary</h2><p>Word practice</p></div>
                <div class="mode-card" onclick="startHangman()"><h2>🪢 Hangman</h2><p>Vocabulary challenge</p></div>
            </div>
        </div>

        <div class="screen" id="screen-practice">
            <button class="btn btn-secondary" onclick="showScreen('class')" style="margin-bottom:20px">← Exit</button>
            <div class="flashcard">
                <div id="cardMain" class="card-main"></div>
                <div id="cardPinyin" style="color:var(--color-primary); margin-top:10px"></div>
            </div>
            <input type="text" id="answerInput" class="answer-input" placeholder="Type answer and press Enter...">
            <div id="feedback" style="margin-top:20px; font-weight:600"></div>
            <button id="nextBtn" class="btn btn-primary hidden" onclick="nextItem()" style="margin-top:20px; width:100%">Next →</button>
        </div>

        <div class="screen" id="screen-hangman">
            <button class="btn btn-secondary" onclick="showScreen('class')" style="margin-bottom:20px">← Exit</button>
            <div class="hm-figure" id="hmFigure"></div>
            <div style="text-align:center; margin-bottom:20px">
                <h2 id="hmZh" class="card-main"></h2>
                <p id="hmPinyin" style="color:var(--color-primary)"></p>
            </div>
            <input type="text" id="hmInput" class="answer-input" placeholder="Type English meaning...">
            <div id="hmLives" style="margin-top:10px; text-align:center"></div>
        </div>
    </main>

    <script>
        // MASTER CONFIGURATION
        const LESSONS = [
            { id: 1, name: "Basics", topic: "Introductions", file: "class1.json" },
            { id: 2, name: "Numbers", topic: "Counting & Time", file: "class2.json" },
            { id: 3, name: "Objects", topic: "Daily Items", file: "class3.json" },
            { id: 4, name: "Locations", topic: "Prepositions", file: "class4.json" },
            { id: 5, name: "Weather", topic: "Environment", file: "class5.json" }
        ];

        let currentData = null;
        let currentIndex = 0;
        let currentMode = '';
        let lives = 5;

        // THEME TOGGLE
        document.getElementById('themeToggle').onclick = () => {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
        }

        // RENDER HOME SCREEN
        function init() {
            const grid = document.getElementById('classGrid');
            grid.innerHTML = LESSONS.map(l => `
                <div class="class-card" onclick="loadClass('${l.file}')">
                    <div style="font-size:12px; font-weight:bold; color:var(--color-primary)">CLASS ${l.id}</div>
                    <h2>${l.name}</h2>
                    <p>${l.topic}</p>
                </div>
            `).join('');
        }

        async function loadClass(file) {
            try {
                const res = await fetch(`./data/${file}`);
                currentData = await res.json();
                document.getElementById('classTitle').textContent = currentData.name;
                document.getElementById('classTopic').textContent = currentData.topic;
                showScreen('class');
            } catch (e) {
                alert("Could not load class data. Check your data folder.");
            }
        }

        function openMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            currentItems = currentData[mode];
            if (!currentItems || currentItems.length === 0) return alert("No items in this category.");
            showScreen('practice');
            renderCard();
        }

        function renderCard() {
            const item = currentData[currentMode][currentIndex];
            document.getElementById('cardMain').textContent = item.zh;
            document.getElementById('cardPinyin').textContent = '';
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').disabled = false;
            document.getElementById('feedback').textContent = '';
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('answerInput').focus();
        }

        document.getElementById('answerInput').onkeydown = (e) => {
            if (e.key === 'Enter') checkAnswer();
        };

        function checkAnswer() {
            const input = document.getElementById('answerInput');
            const item = currentData[currentMode][currentIndex];
            const isCorrect = input.value.toLowerCase().trim() === item.en.toLowerCase().trim();
            
            input.disabled = true;
            document.getElementById('cardPinyin').textContent = item.pinyin;
            const fb = document.getElementById('feedback');
            
            if (isCorrect) {
                fb.textContent = "✅ Correct!";
                fb.style.color = "var(--color-success)";
            } else {
                fb.textContent = `❌ Wrong. Answer: ${item.en}`;
                fb.style.color = "var(--color-error)";
            }
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextItem() {
            currentIndex++;
            if (currentIndex >= currentData[currentMode].length) {
                alert("Session Complete!");
                showScreen('class');
            } else {
                renderCard();
            }
        }

        // HANGMAN LOGIC
        function startHangman() {
            lives = 5;
            currentIndex = 0;
            currentItems = [...currentData.vocab].sort(() => Math.random() - 0.5);
            showScreen('hangman');
            renderHM();
        }

        function renderHM() {
            const item = currentItems[currentIndex];
            document.getElementById('hmZh').textContent = item.zh;
            document.getElementById('hmPinyin').textContent = '';
            document.getElementById('hmInput').value = '';
            document.getElementById('hmLives').textContent = "❤️".repeat(lives);
            document.getElementById('hmFigure').textContent = `LIVES LEFT: ${lives}`;
            document.getElementById('hmInput').focus();
        }

        document.getElementById('hmInput').onkeydown = (e) => {
            if (e.key === 'Enter') {
                const item = currentItems[currentIndex];
                if (document.getElementById('hmInput').value.toLowerCase().trim() === item.en.toLowerCase()) {
                    currentIndex++;
                    if (currentIndex >= currentItems.length) {
                        alert("Victory! You knew all the words.");
                        showScreen('class');
                    } else {
                        renderHM();
                    }
                } else {
                    lives--;
                    if (lives <= 0) {
                        alert(`Game Over! The word was: ${item.en}`);
                        showScreen('class');
                    } else {
                        renderHM();
                    }
                }
            }
        };

        init();
    </script>
</body>
</html>
